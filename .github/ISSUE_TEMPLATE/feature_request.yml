name: Feature request
description: Suggest something new or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature and the problem it solves.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
      description: Other ways to do it, or other games and tools that do it well.
  - type: markdown
    attributes:
      value: Never post game files, keys or saves.
