# The OpenSmash launcher (OpenSmash.Launcher, OpenSmash.exe), built here so players need no .NET SDK: the
# installer (tools/install_windowsmash.ps1, Step-Launcher) downloads releases/latest/download/OpenSmash.exe and
# checks it against OpenSmash.exe.sha256 beside it. Nothing in it comes from the game. A tag v<n> or
# launcher-v<n> publishes both to that tag's release; a manual run keeps them as the run's artifact.
# The same exe is also published as OpenSmash-Setup.exe (shown as "OpenSmash Setup.exe"; GitHub turns spaces in asset
# names into dots): what players download. Alone, it gets the project from GitHub into a folder, makes the
# shortcuts and opens the launcher there (OpenSmash.Launcher\FirstRunForm.cs).
name: Launcher release

on:
  push:
    tags: ['v*', 'launcher-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launcher:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build OpenSmash.exe
        shell: pwsh
        run: |
          ./tools/build_launcher.ps1
          $h = (Get-FileHash OpenSmash.exe -Algorithm SHA256).Hash.ToLower()
          "$h  OpenSmash.exe" | Set-Content -Encoding ascii OpenSmash.exe.sha256
          Copy-Item OpenSmash.exe OpenSmash-Setup.exe
          $h = (Get-FileHash OpenSmash-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  OpenSmash-Setup.exe" | Set-Content -Encoding ascii OpenSmash-Setup.exe.sha256
          Get-Content OpenSmash.exe.sha256, OpenSmash-Setup.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: OpenSmash-launcher
          path: |
            OpenSmash.exe
            OpenSmash.exe.sha256
            OpenSmash-Setup.exe
            OpenSmash-Setup.exe.sha256

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag 2>$null; if ($LASTEXITCODE -ne 0) { gh release create $tag --title $tag --notes "OpenSmash $tag" }
          gh release upload $tag OpenSmash.exe OpenSmash.exe.sha256 'OpenSmash-Setup.exe#OpenSmash Setup.exe' OpenSmash-Setup.exe.sha256 --clobber
