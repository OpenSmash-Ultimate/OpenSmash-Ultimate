# Epic Online Services for players' builds (tools/eos_fetch.py, runtime/net_eos.c): the release eos-1 holds Epic's
# EOSSDK-Win64-Shipping.dll (uploaded once by hand: Epic's download needs a developer login) and eos.txt, the
# product's client credentials, written here from the repository's secrets, with SHA256SUMS of both. Run by hand
# (Actions > EOS release > Run workflow) after the DLL is in the release or a secret changes.
name: EOS release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  eos:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: eos-1
    steps:
      - name: eos.txt and SHA256SUMS
        env:
          EOS_PRODUCT_ID: ${{ secrets.EOS_PRODUCT_ID }}
          EOS_SANDBOX_ID: ${{ secrets.EOS_SANDBOX_ID }}
          EOS_DEPLOYMENT_ID: ${{ secrets.EOS_DEPLOYMENT_ID }}
          EOS_CLIENT_ID: ${{ secrets.EOS_CLIENT_ID }}
          EOS_CLIENT_SECRET: ${{ secrets.EOS_CLIENT_SECRET }}
        run: |
          set -e
          mkdir out && cd out
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern EOSSDK-Win64-Shipping.dll
          printf 'ProductId=%s\nSandboxId=%s\nDeploymentId=%s\nClientId=%s\nClientSecret=%s\n' \
            "$EOS_PRODUCT_ID" "$EOS_SANDBOX_ID" "$EOS_DEPLOYMENT_ID" "$EOS_CLIENT_ID" "$EOS_CLIENT_SECRET" > eos.txt
          for v in EOS_PRODUCT_ID EOS_SANDBOX_ID EOS_DEPLOYMENT_ID EOS_CLIENT_ID EOS_CLIENT_SECRET; do
            [ -n "${!v}" ] || { echo "the secret $v is empty"; exit 1; }
          done
          sha256sum EOSSDK-Win64-Shipping.dll eos.txt > SHA256SUMS
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber eos.txt SHA256SUMS
