name: Experimental Avalonia launcher
on:
  pull_request:
    paths: ['OpenSmash.Avalonia/**', 'OpenSmash.Launcher/SettingDefaults.cs', 'tests/desktop/**', 'tests/test_avalonia_side_by_side.py', 'tools/*avalonia*', '.github/workflows/avalonia-launcher.yml']
  push:
    branches: [main]
    paths: ['OpenSmash.Avalonia/**', 'OpenSmash.Launcher/SettingDefaults.cs', 'tests/desktop/**', 'tests/test_avalonia_side_by_side.py', 'tools/*avalonia*', '.github/workflows/avalonia-launcher.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet run --project tests/desktop -c Release
      - run: python -m unittest discover -s tests -p test_avalonia_side_by_side.py
      - run: python tools/publish_avalonia.py --rid ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: Experimental-Avalonia-${{ matrix.rid }}
          path: |
            dist/avalonia/*.zip
            dist/avalonia/*.tar.gz
          retention-days: 14
