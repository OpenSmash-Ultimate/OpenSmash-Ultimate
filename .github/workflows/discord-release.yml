# Discord for players' builds (tools/discord_fetch.py, runtime/net_discord.c): the release discord-1 holds Discord's
# discord_partner_sdk.dll and discord_partner_sdk_notices.txt (the Social SDK's License-Notices.txt), uploaded once by
# hand from the SDK's Windows package, and discord.txt, the Discord application's id, written here from the repository's
# secret DISCORD_APP_ID, with SHA256SUMS of all three. Run by hand (Actions > Discord release > Run workflow) after
# the DLL is in the release or the secret changes.
name: Discord release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discord:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: discord-1
    steps:
      - name: discord.txt and SHA256SUMS
        env:
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
        run: |
          set -e
          case "$DISCORD_APP_ID" in ''|*[!0-9]*) echo "the secret DISCORD_APP_ID is empty or not a number"; exit 1 ;; esac
          mkdir out && cd out
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern discord_partner_sdk.dll --pattern discord_partner_sdk_notices.txt
          printf '# OpenSmash: the Discord application (runtime/net_discord.c, the launchers)\nApplicationId=%s\n' "$DISCORD_APP_ID" > discord.txt
          sha256sum discord_partner_sdk.dll discord_partner_sdk_notices.txt discord.txt > SHA256SUMS
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false   # never "latest"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber discord.txt SHA256SUMS
